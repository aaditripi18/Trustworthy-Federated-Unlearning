# Federated training configuration (M3). Loaded with data.yaml + model.yaml.
# num_clients / image_size / num_labels come from data.yaml.

seed: 42

federated:
  # Frozen Stage-1 baseline regime (validated on 2 seeds): the SINGLE from-scratch
  # training regime used by Original and Oracle. Do not diverge these two.
  num_rounds: 30
  local_epochs: 2
  lr: 0.0002              # peak LR for warmup+cosine
  warmup_rounds: 3        # linear warmup, then cosine decay to ~0
  lr_schedule: cosine
  use_pos_weight: true    # BCEWithLogitsLoss(pos_weight = neg/pos per label)
  pos_weight_cap: 20.0
  early_stop_patience: 5  # early stop + best-checkpoint on val macro-AUROC
  weight_decay: 0.0001
  device: auto
  ckpt_dir: experiments
  # store_history=false to prevent host-RAM OOM on 16 GB g4dn.xlarge: when true,
  # every round keeps a full copy of the global + all client params (~88 MB each
  # for DeiT-Small), ~7 GB across all stages of a seed. The M8 final pipeline never
  # reads history (only a hypothetical FedEraser update-replay method would), so
  # disabling it changes no scientific output — only memory.
  store_history: false     # was true; history unused by oracle/finetune_retain/EPU
  threshold: 0.5
