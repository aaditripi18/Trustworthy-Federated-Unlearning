# NIH ChestX-ray14 data configuration (M8, real dataset).
# Used by the M8 driver; the synthetic configs/data.yaml stays the default so
# all M0-M7 tests keep running. See docs/DATASET_NIH.md for download + layout.

seed: 42

data:
  source: nih
  root: data
  num_labels: 14              # the 14 official NIH findings
  image_size: 224             # ViT input resolution
  val_fraction: 0.15          # patient-level splits (no leakage)
  test_fraction: 0.15
  num_clients: 5              # hospitals
  batch_size: 32

  # --- Performance-only knobs (do NOT affect results) ---
  # NOTE: eval_num_workers set to 0 to avoid OOM on 16 GB g4dn.xlarge. With >0,
  # each forked DataLoader worker copy-on-write-duplicated the multi-GB image
  # cache (Python refcounting defeats fork sharing), pushing a single worker to
  # ~14 GB RSS and triggering the OOM killer. With 0 workers the cache lives once
  # in the main process (~5.6 GB) and fits comfortably. Eval loaders are
  # shuffle=False with a deterministic transform, so worker count cannot change
  # batch contents, order, predictions, metrics, or explanations.
  cache_images: true          # decode each PNG once, reuse the uint8 across rounds
  eval_num_workers: 0         # was 4; 0 = load in main process (no worker OOM)
  pin_memory: true            # faster host->device copies (no numeric effect)

  nih:
    csv: data/nih/Data_Entry_2017_v2020.csv
    images_dir: data/nih/images        # flat dir containing all *.png
    subset_size: null                  # cap #patients for a smoke run (null = full)

  partition:
    scheme: dirichlet          # iid | dirichlet
    alpha: 0.5                 # Dirichlet concentration (smaller => more non-IID)
