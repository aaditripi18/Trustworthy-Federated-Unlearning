# Model + training config for the real NIH run (M8). DeiT-Small at 224.
# Named timm model: embed_dim/depth/num_heads/patch_size are fixed by the
# architecture and carried here only for reference.

seed: 42

model:
  name: deit_small_patch16_224
  pretrained: true            # ImageNet-pretrained init (recommended for real CXR)
  in_chans: 1                 # grayscale
  patch_size: 16

train:
  epochs: 10
  lr: 0.0003
  weight_decay: 0.0001
  device: auto
  ckpt_dir: experiments
  threshold: 0.5
